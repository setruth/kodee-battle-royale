[versions]
kotlin = "2.4.0"
logback = "1.5.35"
exposed = "1.3.1"            # 注意：Exposed 1.x 包根为 org.jetbrains.exposed.v1.*
postgresql = "42.7.13"
hikari = "5.1.0"             # 5.x 长寿稳定线
webrtc = "0.14.0"
kotlinx-serialization = "1.11.0"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
webrtc-java = { module = "dev.onvoid.webrtc:webrtc-java", version.ref = "webrtc" }
# natives 为同一 artifact 的 classifier，catalog 不支持 classifier 键 → 在 build.gradle.kts 里直接声明

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
