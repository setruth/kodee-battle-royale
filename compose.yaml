name: kodee-battle-royale

services:
  database:
    image: ${DOCKER_HUB_PREFIX-m.daocloud.io/docker.io/library/}postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kotlin_game}
      POSTGRES_USER: ${POSTGRES_USER:-kodee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./server
      args:
        DOCKER_HUB_PREFIX: ${DOCKER_HUB_PREFIX-m.daocloud.io/docker.io/library/}
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 8011
      DB_URL: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-kotlin_game}
      DB_USER: ${POSTGRES_USER:-kodee}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WEBRTC_MIN_PORT: ${WEBRTC_MIN_PORT:-50000}
      WEBRTC_MAX_PORT: ${WEBRTC_MAX_PORT:-50100}
      WEBRTC_STUN_URL: ${WEBRTC_STUN_URL:-}
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./web
      args:
        DOCKER_HUB_PREFIX: ${DOCKER_HUB_PREFIX-m.daocloud.io/docker.io/library/}
        VITE_API_BASE_URL: /kt15/api
        VITE_STUN_URL: ${WEBRTC_STUN_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:8080"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
